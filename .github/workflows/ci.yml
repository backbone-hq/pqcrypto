name: CI

on:
  push:
    tags: [v*]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install maturin pytest
      - run: maturin build --release --out dist
      - run: pip install dist/*.whl
      - run: pytest tests/ -q
      - run: maturin sdist --out dist
      - run: pip install --force-reinstall dist/*.tar.gz
      - run: pytest tests/ -q
      - uses: actions/upload-artifact@v7
        with:
          name: pqcrypto-sdist
          path: dist/*.tar.gz

  build-linux:
    name: ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_34"
            image: python:3.12
          - platform: manylinux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_34"
            image: python:3.12
          - platform: musllinux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            image: python:3.12-alpine
          - platform: musllinux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            image: python:3.12-alpine
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Test wheel
        run: |
          docker run --rm -v "$PWD":/io -w /io ${{ matrix.image }} \
            sh -c "pip install /io/dist/*abi3*.whl pytest && \
            pytest /io/tests/ -q"
      - uses: actions/upload-artifact@v7
        with:
          name: pqcrypto-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  build-native:
    name: ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runs-on: macos-14
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            runs-on: macos-15-intel
            target: x86_64-apple-darwin
          - platform: windows-amd64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: off
          args: --release --out dist
      - name: Test
        shell: bash
        run: pip install dist/*.whl pytest && pytest tests/ -q
      - uses: actions/upload-artifact@v7
        with:
          name: pqcrypto-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [build-linux, build-native]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches version
        run: |
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"" pyproject.toml

      - uses: actions/download-artifact@v8
        with:
          pattern: pqcrypto-*
          merge-multiple: true
          path: dist

      - name: Check the wheel set
        run: |
          n=$(ls dist/*.whl | wc -l)
          echo "$n wheels"
          [ "$n" -eq 7 ] || {
            echo "expected 7 wheels, got $n" >&2
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          dry-run: true
          skip-existing: true
