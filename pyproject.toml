[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pqcrypto"
version = "1.0.0"
description = "Python bindings for post-quantum cryptography — ML-KEM, ML-DSA, SLH-DSA, Classic McEliece, HQC, and SNTRUP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Backbone Technologies Ltd.", email = "root@backbone.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
]
keywords = [
  "post-quantum",
  "cryptography",
  "pqc",
  "ml-kem",
  "ml-dsa",
  "slh-dsa",
  "mceliece",
  "sntrup",
  "fips",
  "nist",
  "kem",
  "signature",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/backbone-hq/pqcrypto"
Repository = "https://github.com/backbone-hq/pqcrypto"
Documentation = "https://github.com/backbone-hq/pqcrypto"

[project.optional-dependencies]
testing = ["pytest>=7"]

[tool.maturin]
python-source = "python"
exclude = [
  ".github/**",
  "media/**",
  "tests/**",
  ".gitignore",
  ".pre-commit-config.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
